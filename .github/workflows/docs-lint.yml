name: Docs Lint

on:
  pull_request:
    paths: ["**/*.md", ".markdownlint-cli2.jsonc"]
  push:
    branches: [main]
    paths: ["**/*.md", ".markdownlint-cli2.jsonc"]

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
