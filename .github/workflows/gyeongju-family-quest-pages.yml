name: Deploy Gyeongju Family Quest

on:
  push:
    branches:
      - gyeongju-public
    paths:
      - "services/gyeongju-family-quest/**"
      - ".github/workflows/gyeongju-family-quest-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "gyeongju-family-quest-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: services/gyeongju-family-quest

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
